# Repos authorized to send results to the RHEL Results Relay. HUD forwarding is
# independent of submission authorization and defaults to false when omitted.
allowed_repos:
  - repo: TorchedHat/pytorch-redhat-ci
    forward_to_hud: true
  - repo: subinz1/CRCR
    forward_to_hud: false
  - repo: torch-spyre/torch-spyre
    forward_to_hud: true
  # - repo: partner-org/partner-repo
  #   forward_to_hud: false
