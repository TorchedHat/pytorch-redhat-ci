name: "Results Relay: Receive External CI Results"

on:
  repository_dispatch:
    types: [external-ci-result]

run-name: >-
  [${{ github.event.client_payload.result.event_type || 'unknown' }}]
  ${{ github.event.client_payload.relay.source_repo || 'unknown-repo' }}
  — ${{ github.event.client_payload.result.conclusion || '?' }}
  (${{ github.event.client_payload.result.job_name || 'no job name' }})

permissions:
  contents: read
  id-token: write

jobs:
  process-result:
    name: "Process external CI result"
    runs-on: ubuntu-latest
    steps:
      - name: Prepare partner workflow link
        id: partner-workflow
        env:
          SOURCE_REPO: ${{ github.event.client_payload.relay.source_repo }}
          RUN_ID: ${{ github.event.client_payload.result.run_id }}
        run: |
          if [[ "$SOURCE_REPO" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] && [[ "$RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "url=https://github.com/${SOURCE_REPO}/actions/runs/${RUN_ID}" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Partner result did not include a usable GitHub Actions run link"
          fi

      - name: Display received results
        env:
          SOURCE_REPO: ${{ github.event.client_payload.relay.source_repo }}
          EVENT_TYPE: ${{ github.event.client_payload.result.event_type }}
          DELIVERY_ID: ${{ github.event.client_payload.result.delivery_id }}
          JOB_NAME: ${{ github.event.client_payload.result.job_name }}
          STATUS: ${{ github.event.client_payload.result.status }}
          CONCLUSION: ${{ github.event.client_payload.result.conclusion }}
          WORKFLOW_NAME: ${{ github.event.client_payload.result.workflow_name }}
          RUN_ID: ${{ github.event.client_payload.result.run_id }}
          RUN_ATTEMPT: ${{ github.event.client_payload.result.run_attempt }}
          PARTNER_WORKFLOW_URL: ${{ steps.partner-workflow.outputs.url }}
          FORWARD_TO_HUD: ${{ github.event.client_payload.relay.forward_to_hud || false }}
          FULL_PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          echo "============================================"
          echo "  External CI Result Received"
          echo "============================================"
          echo ""
          echo "Source Repo:    ${SOURCE_REPO}"
          echo "Event Type:     ${EVENT_TYPE}"
          echo "Delivery ID:    ${DELIVERY_ID}"
          echo "Job Name:       ${JOB_NAME}"
          echo "Status:         ${STATUS}"
          echo "Conclusion:     ${CONCLUSION}"
          echo "Workflow:       ${WORKFLOW_NAME}"
          echo "Run ID:         ${RUN_ID}"
          echo "Run Attempt:    ${RUN_ATTEMPT}"
          echo "Partner Run:    ${PARTNER_WORKFLOW_URL:-unavailable}"
          echo "Forward to HUD: ${FORWARD_TO_HUD}"
          echo ""
          echo "--- Full Payload ---"
          echo "${FULL_PAYLOAD}" | python3 -m json.tool 2>/dev/null || echo "${FULL_PAYLOAD}"
          echo ""

          echo "## External CI Result" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Source Repo | \`${SOURCE_REPO}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Event Type | \`${EVENT_TYPE}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Delivery ID | \`${DELIVERY_ID}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Job Name | \`${JOB_NAME}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Status | \`${STATUS}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Conclusion | \`${CONCLUSION}\` |" >> $GITHUB_STEP_SUMMARY
          if [ -n "$PARTNER_WORKFLOW_URL" ]; then
            echo "| Partner Run | [Open workflow run](${PARTNER_WORKFLOW_URL}) |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Partner Run | unavailable |" >> $GITHUB_STEP_SUMMARY
          fi
          echo "| Forward to HUD | \`${FORWARD_TO_HUD}\` |" >> $GITHUB_STEP_SUMMARY

      - name: Validate required fields
        id: validate
        env:
          DELIVERY_ID: ${{ github.event.client_payload.result.delivery_id }}
          EVENT_TYPE: ${{ github.event.client_payload.result.event_type }}
          JOB_NAME: ${{ github.event.client_payload.result.job_name }}
          CONCLUSION: ${{ github.event.client_payload.result.conclusion }}
        run: |
          MISSING=""
          [ -z "$DELIVERY_ID" ] && MISSING="${MISSING} delivery_id"
          [ -z "$EVENT_TYPE" ] && MISSING="${MISSING} event_type"
          [ -z "$JOB_NAME" ] && MISSING="${MISSING} job_name"
          [ -z "$CONCLUSION" ] && MISSING="${MISSING} conclusion"
          if [ -n "$MISSING" ]; then
            echo "::error::Missing required fields:${MISSING}"
            echo "valid=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "valid=true" >> "$GITHUB_OUTPUT"

      - name: Forward to CRCR/HUD
        if: github.event.client_payload.relay.forward_to_hud == true && steps.validate.outputs.valid == 'true'
        uses: pytorch/test-infra/.github/actions/cross-repo-ci-relay-callback@main
        with:
          status: completed
          conclusion: ${{ github.event.client_payload.result.conclusion }}
          delivery-id: ${{ github.event.client_payload.result.delivery_id }}
          event-type: ${{ github.event.client_payload.result.event_type }}
          job-name: ${{ github.event.client_payload.result.job_name }}
          artifact-url: ${{ steps.partner-workflow.outputs.url }}

      - name: HUD push status
        env:
          FORWARD_TO_HUD: ${{ github.event.client_payload.relay.forward_to_hud || false }}
          SOURCE_REPO: ${{ github.event.client_payload.relay.source_repo }}
        run: |
          if [ "${FORWARD_TO_HUD}" = "true" ]; then
            echo "Results forwarded to CRCR/HUD"
          else
            echo "HUD forwarding is disabled for ${SOURCE_REPO}"
          fi
