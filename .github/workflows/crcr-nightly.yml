name: "CRCR Nightly: RHEL 9.6 Build & Test"

on:
  schedule:
    - cron: "30 8 * * *"  # daily at 08:30 UTC, ~30 min after pytorch/pytorch nightly update
  workflow_dispatch:
    inputs:
      sha:
        description: "pytorch/pytorch SHA to build against (leave empty for latest nightly)"
        required: false
        default: ""
      run_scope:
        description: "Select CPU/CUDA build-only validation or the associated test pipeline"
        required: false
        type: choice
        default: "all"
        options:
          - all
          - cpu
          - cuda
          - cpu-build-only
          - cuda-build-only
      no_cache:
        description: "Force podman --no-cache rebuild (sccache still applies to the CUDA build)"
        required: false
        type: boolean
        default: false
      forward_to_hud:
        description: "Forward completed results to HUD (disable for manual debugging runs)"
        required: false
        type: boolean
        default: true

run-name: >-
  [Nightly] RHEL 9.6 @ ${{ github.event_name == 'schedule' && 'cron' || inputs.sha && 'manual-' || 'manual' }}${{ inputs.sha && format(' ({0})', inputs.sha) || '' }}${{ inputs.run_scope && inputs.run_scope != 'all' && format(' [{0}]', inputs.run_scope) || '' }}${{ github.event_name == 'workflow_dispatch' && !inputs.forward_to_hud && ' [HUD off]' || '' }}

env:
  UPSTREAM_REPO: pytorch/pytorch
  NIGHTLY_BRANCH: nightly
  QUAY_REGISTRY: quay.io/aipcc/pytorch
  CUDA_VERSION: "13_0"
  # Test tier: "sanity", "critical", "full", or "delta"
  # delta = diff-based determination merged with critical tests
  TEST_TIER: "critical"

permissions:
  contents: read
  id-token: write

jobs:
  resolve-source:
    name: "CRCR nightly / resolve source"
    runs-on: linux.rhel96
    timeout-minutes: 15
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
      prev_sha: ${{ steps.sha.outputs.prev_sha }}
      cuda_image_tag: ${{ steps.sha.outputs.cuda_image_tag }}
      cuda_quay_tag: ${{ steps.sha.outputs.cuda_quay_tag }}
      cpu_image_tag: ${{ steps.sha.outputs.cpu_image_tag }}
      cpu_quay_tag: ${{ steps.sha.outputs.cpu_quay_tag }}
    steps:
      - name: Fetch source SHAs from nightly branch
        id: sha
        env:
          INPUT_SHA: ${{ inputs.sha }}
        run: |
          if [ -n "$INPUT_SHA" ]; then
            echo "Using manually provided SHA: $INPUT_SHA"
            SOURCE_SHA="$INPUT_SHA"
            PREV_SOURCE_SHA=""
          else
            NIGHTLY_COMMITS=$(curl -fsSL "https://api.github.com/repos/${UPSTREAM_REPO}/commits?sha=${NIGHTLY_BRANCH}&per_page=2" | jq -r '.[].sha')
            NIGHTLY_SHA=$(echo "$NIGHTLY_COMMITS" | head -1)
            PREV_NIGHTLY_SHA=$(echo "$NIGHTLY_COMMITS" | tail -1)

            if [ -z "$NIGHTLY_SHA" ]; then
              echo "::error::Could not resolve HEAD for ${UPSTREAM_REPO}/${NIGHTLY_BRANCH}"
              exit 1
            fi

            extract_source_sha() {
              local COMMIT_MSG=$(curl -fsSL "https://api.github.com/repos/${UPSTREAM_REPO}/commits/$1" | jq -r '.commit.message')
              echo "$COMMIT_MSG" | grep -oP '\(([a-f0-9]{40})\)' | tr -d '()'
            }

            SOURCE_SHA=$(extract_source_sha "$NIGHTLY_SHA")
            if [ -z "$SOURCE_SHA" ]; then
              echo "::error::Could not extract source SHA from latest nightly commit"
              exit 1
            fi

            PREV_SOURCE_SHA=$(extract_source_sha "$PREV_NIGHTLY_SHA")
            if [ -z "$PREV_SOURCE_SHA" ]; then
              echo "::warning::Could not extract previous source SHA; delta selection will use critical suites"
              PREV_SOURCE_SHA=""
            fi
          fi

          echo "Source main SHA (current): $SOURCE_SHA"
          echo "Source main SHA (previous): $PREV_SOURCE_SHA"
          SHORT_SHA=${SOURCE_SHA:0:7}

          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "prev_sha=$PREV_SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "cuda_image_tag=rhel9-pytorch-nightly:${SOURCE_SHA}" >> "$GITHUB_OUTPUT"
          echo "cuda_quay_tag=${QUAY_REGISTRY}:rhel9_6_pytorch_nightly_main_git${SHORT_SHA}_cuda${CUDA_VERSION}" >> "$GITHUB_OUTPUT"
          echo "cpu_image_tag=rhel9-pytorch-nightly-cpu:${SOURCE_SHA}" >> "$GITHUB_OUTPUT"
          echo "cpu_quay_tag=${QUAY_REGISTRY}:rhel9_6_pytorch_nightly_main_git${SHORT_SHA}_cpu" >> "$GITHUB_OUTPUT"

  build:
    name: "linux-rhel9.6-cuda13.0-py3.12-gcc11-x86_64 / build"
    needs: resolve-source
    if: ${{ github.event_name == 'schedule' || inputs.run_scope == 'all' || inputs.run_scope == 'cuda' || inputs.run_scope == 'cuda-build-only' }}
    runs-on: linux.rhel96
    timeout-minutes: 600
    outputs:
      sha: ${{ needs.resolve-source.outputs.sha }}
      prev_sha: ${{ needs.resolve-source.outputs.prev_sha }}
      image_tag: ${{ needs.resolve-source.outputs.cuda_image_tag }}
      quay_tag: ${{ needs.resolve-source.outputs.cuda_quay_tag }}
    steps:
      - name: Checkout CI repo
        uses: actions/checkout@v4

      - name: Log in to Quay.io
        env:
          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
          QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
        run: |
          echo "$QUAY_PASSWORD" | podman login quay.io -u "$QUAY_USERNAME" --password-stdin

      - name: Set up sccache
        id: sccache
        run: scripts/sccache.sh prepare

      - name: Build container image
        env:
          IMAGE_TAG: ${{ needs.resolve-source.outputs.cuda_image_tag }}
          PYTORCH_SHA: ${{ needs.resolve-source.outputs.sha }}
          SUBSCRIPTION_KEY: ${{ secrets.RHEL_SUBSCRIPTION_ACTIVATION_KEY }}
          SUBSCRIPTION_ORG: ${{ secrets.RHEL_SUBSCRIPTION_ORG_ID }}
          NO_CACHE: ${{ inputs.no_cache }}
        run: |
          echo "$SUBSCRIPTION_KEY" > /tmp/sub_key.txt
          echo "$SUBSCRIPTION_ORG" > /tmp/sub_org.txt

          NO_CACHE_FLAG=""
          if [ "${NO_CACHE}" = "true" ]; then
            echo "Building with --no-cache (forced full rebuild)"
            NO_CACHE_FLAG="--no-cache"
          fi

          podman build \
            --file docker/Dockerfile.rhel9 \
            --build-arg COMMIT_HASH="${PYTORCH_SHA}" \
            --build-arg ENABLE_SUBSCRIPTION=true \
            --build-arg RHEL_OS_VERSION=9.6 \
            --secret id=subscription_key,src=/tmp/sub_key.txt \
            --secret id=subscription_org,src=/tmp/sub_org.txt \
            ${{ steps.sccache.outputs.volume_arg }} \
            ${NO_CACHE_FLAG} \
            --tag "${IMAGE_TAG}" \
            .

          rm -f /tmp/sub_key.txt /tmp/sub_org.txt

      - name: sccache build statistics
        if: always() && steps.sccache.outputs.volume_arg != ''
        run: |
          scripts/sccache.sh stats \
            --image "${{ needs.resolve-source.outputs.cuda_image_tag }}" \
            --cache-dir "${{ steps.sccache.outputs.cache_dir }}"

      - name: Tag and push to Quay.io
        id: quay_push
        continue-on-error: true
        env:
          IMAGE_TAG: ${{ needs.resolve-source.outputs.cuda_image_tag }}
          QUAY_TAG: ${{ needs.resolve-source.outputs.cuda_quay_tag }}
        run: |
          podman tag "${IMAGE_TAG}" "${QUAY_TAG}"
          podman push "${QUAY_TAG}"
          echo "Pushed: ${QUAY_TAG}"

      - name: Build summary
        env:
          IMAGE_TAG: ${{ needs.resolve-source.outputs.cuda_image_tag }}
          QUAY_TAG: ${{ needs.resolve-source.outputs.cuda_quay_tag }}
          PYTORCH_SHA: ${{ needs.resolve-source.outputs.sha }}
          SCCACHE_CACHE_DIR: ${{ steps.sccache.outputs.cache_dir }}
          NO_CACHE: ${{ inputs.no_cache }}
        run: |
          echo "## CRCR Nightly: RHEL 9.6 — Build" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Nightly SHA | [\`${PYTORCH_SHA}\`](https://github.com/pytorch/pytorch/commit/${PYTORCH_SHA}) |" >> $GITHUB_STEP_SUMMARY
          echo "| Local Image | \`${IMAGE_TAG}\` |" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.quay_push.outcome }}" = "success" ]; then
            echo "| Quay Image | \`${QUAY_TAG}\` |" >> $GITHUB_STEP_SUMMARY
          else
            echo "::warning::Failed to upload ${QUAY_TAG} to Quay.io"
            echo "| Quay Image | failed to upload \`${QUAY_TAG}\` |" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -d "${SCCACHE_CACHE_DIR}" ]; then
            CACHE_SIZE=$(du -sh "${SCCACHE_CACHE_DIR}" 2>/dev/null | cut -f1 || echo "N/A")
            echo "| sccache | \`enabled\` (${CACHE_SIZE}) |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| sccache | \`disabled\` |" >> $GITHUB_STEP_SUMMARY
          fi
          echo "| no_cache | \`${NO_CACHE}\` |" >> $GITHUB_STEP_SUMMARY

      - name: Report to CRCR
        if: ${{ always() && job.status == 'success' && (github.event_name == 'schedule' || inputs.forward_to_hud) }}
        continue-on-error: true
        uses: pytorch/test-infra/.github/actions/cross-repo-ci-relay-callback@main
        with:
          status: completed
          conclusion: ${{ job.status }}
          delivery-id: ${{ needs.resolve-source.outputs.sha }}
          event-type: nightly
          job-name: "linux-rhel9.6-cuda13.0-py3.12-gcc11-x86_64 / build"

  cpu-build:
    name: "linux-rhel9.6-cpu-py3.12-x86_64 / build"
    needs: resolve-source
    if: ${{ github.event_name == 'schedule' || inputs.run_scope == 'all' || inputs.run_scope == 'cpu' || inputs.run_scope == 'cpu-build-only' }}
    runs-on: linux.rhel96-cpu
    timeout-minutes: 600
    outputs:
      sha: ${{ needs.resolve-source.outputs.sha }}
      prev_sha: ${{ needs.resolve-source.outputs.prev_sha }}
      image_tag: ${{ needs.resolve-source.outputs.cpu_image_tag }}
      quay_tag: ${{ needs.resolve-source.outputs.cpu_quay_tag }}
      image_pushed: ${{ steps.image_publish.outputs.pushed }}
    steps:
      - name: Checkout CI repo
        uses: actions/checkout@v4

      - name: Log in to Quay.io
        env:
          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
          QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
        run: echo "$QUAY_PASSWORD" | podman login quay.io -u "$QUAY_USERNAME" --password-stdin

      - name: Build CPU container image
        env:
          IMAGE_TAG: ${{ needs.resolve-source.outputs.cpu_image_tag }}
          PYTORCH_SHA: ${{ needs.resolve-source.outputs.sha }}
          SUBSCRIPTION_KEY: ${{ secrets.RHEL_SUBSCRIPTION_ACTIVATION_KEY }}
          SUBSCRIPTION_ORG: ${{ secrets.RHEL_SUBSCRIPTION_ORG_ID }}
          NO_CACHE: ${{ inputs.no_cache }}
        run: |
          umask 077
          KEY_FILE=$(mktemp)
          ORG_FILE=$(mktemp)
          cleanup() {
            rm -f "${KEY_FILE}" "${ORG_FILE}"
          }
          trap cleanup EXIT
          printf '%s' "${SUBSCRIPTION_KEY}" > "${KEY_FILE}"
          printf '%s' "${SUBSCRIPTION_ORG}" > "${ORG_FILE}"

          BUILD_ARGS=(
            --file docker/Dockerfile.rhel9-cpu
            --build-arg COMMIT_HASH="${PYTORCH_SHA}"
            --build-arg ENABLE_SUBSCRIPTION=true
            --build-arg RHEL_OS_VERSION=9.6
            --build-arg BUILD_ENVIRONMENT=linux-rhel9.6-cpu-py3.12
            --secret id=subscription_key,src="${KEY_FILE}"
            --secret id=subscription_org,src="${ORG_FILE}"
          )
          if [ "${NO_CACHE}" = "true" ]; then
            BUILD_ARGS+=(--no-cache)
          fi

          podman build \
            "${BUILD_ARGS[@]}" \
            --tag "${IMAGE_TAG}" \
            .

      - name: Verify CPU-only build
        env:
          IMAGE_TAG: ${{ needs.resolve-source.outputs.cpu_image_tag }}
        run: |
          podman run --rm "${IMAGE_TAG}" bash -c '
            source /miniconda/etc/profile.d/conda.sh && conda activate cpu_torch_build
            cd /tmp
            python -c "
          import torch
          assert torch.version.cuda is None, torch.version.cuda
          assert not torch.cuda.is_available()
          result = torch.randn(64, 64) @ torch.randn(64, 64)
          assert result.shape == (64, 64)
          print(f\"CPU-only PyTorch {torch.__version__} loaded successfully\")
          "
          '

      - name: Tag and push to Quay.io
        id: quay_push
        continue-on-error: true
        env:
          IMAGE_TAG: ${{ needs.resolve-source.outputs.cpu_image_tag }}
          QUAY_TAG: ${{ needs.resolve-source.outputs.cpu_quay_tag }}
        run: |
          podman tag "${IMAGE_TAG}" "${QUAY_TAG}"
          podman push "${QUAY_TAG}"
          echo "Pushed: ${QUAY_TAG}"

      - name: Record image publication result
        id: image_publish
        if: always()
        run: echo "pushed=${{ steps.quay_push.outcome == 'success' }}" >> "$GITHUB_OUTPUT"

      - name: Build summary
        if: always()
        env:
          IMAGE_TAG: ${{ needs.resolve-source.outputs.cpu_image_tag }}
          QUAY_TAG: ${{ needs.resolve-source.outputs.cpu_quay_tag }}
          PYTORCH_SHA: ${{ needs.resolve-source.outputs.sha }}
          IMAGE_PUSHED: ${{ steps.image_publish.outputs.pushed }}
          NO_CACHE: ${{ inputs.no_cache }}
        run: |
          echo "## CRCR Nightly: RHEL 9.6 — CPU Build" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Property | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Nightly SHA | [\`${PYTORCH_SHA}\`](https://github.com/pytorch/pytorch/commit/${PYTORCH_SHA}) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Local Image | \`${IMAGE_TAG}\` |" >> "$GITHUB_STEP_SUMMARY"
          if [ "${IMAGE_PUSHED}" = "true" ]; then
            echo "| Quay Image | \`${QUAY_TAG}\` |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Failed to upload ${QUAY_TAG} to Quay.io"
            echo "| Quay Image | failed to upload \`${QUAY_TAG}\` |" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "| no_cache | \`${NO_CACHE}\` |" >> "$GITHUB_STEP_SUMMARY"

      - name: Report to CRCR
        if: ${{ always() && job.status == 'success' && (github.event_name == 'schedule' || inputs.forward_to_hud) }}
        continue-on-error: true
        uses: pytorch/test-infra/.github/actions/cross-repo-ci-relay-callback@main
        with:
          status: completed
          conclusion: ${{ job.status }}
          delivery-id: ${{ needs.resolve-source.outputs.sha }}
          event-type: nightly
          job-name: "linux-rhel9.6-cpu-py3.12-x86_64 / build"

  determine-cpu-tests:
    name: "linux-rhel9.6-cpu-py3.12-x86_64 / determine-tests"
    needs: cpu-build
    if: ${{ !cancelled() && needs.cpu-build.result == 'success' && (github.event_name == 'schedule' || inputs.run_scope == 'all' || inputs.run_scope == 'cpu') }}
    runs-on: linux.rhel96-cpu
    timeout-minutes: 600
    outputs:
      cpu_tests: ${{ steps.resolve.outputs.cpu_tests }}
      cpu_count: ${{ steps.resolve.outputs.count }}
      mode: ${{ steps.resolve.outputs.mode }}
    env:
      IMAGE_TAG: ${{ needs.cpu-build.outputs.image_tag }}
      QUAY_TAG: ${{ needs.cpu-build.outputs.quay_tag }}
      IMAGE_PUSHED: ${{ needs.cpu-build.outputs.image_pushed }}
      PYTORCH_SHA: ${{ needs.cpu-build.outputs.sha }}
      PREV_SHA: ${{ needs.cpu-build.outputs.prev_sha }}
    steps:
      - name: Checkout CI repo
        uses: actions/checkout@v4

      - name: Restore CPU image when needed
        env:
          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
          QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
        run: |
          if podman image exists "${IMAGE_TAG}"; then
            exit 0
          fi
          if [ "${IMAGE_PUSHED}" != "true" ]; then
            echo "::error::The CPU image is not local and the Quay upload failed. Re-run after Quay is available."
            exit 1
          fi
          echo "${QUAY_PASSWORD}" | podman login quay.io -u "${QUAY_USERNAME}" --password-stdin
          podman pull "${QUAY_TAG}"
          podman tag "${QUAY_TAG}" "${IMAGE_TAG}"

      - name: Resolve CPU test list
        id: resolve
        run: |
          MODE="configured"
          COMMANDS=""
          if [ "${TEST_TIER}" = "delta" ] && [ -n "${PREV_SHA}" ]; then
            echo "Delta mode: comparing ${PREV_SHA:0:10}..${PYTORCH_SHA:0:10}"
            DELTA_TESTS=$(podman run --rm -v "$(pwd)/scripts:/ci_scripts:ro" "${IMAGE_TAG}" bash -c "
              source /miniconda/etc/profile.d/conda.sh && conda activate cpu_torch_build
              cd /pytorch
              VALID_TESTS=\$(python test/run_test.py -i __probe__ 2>&1 | grep 'invalid choice' | sed \"s/.*choose from //\" | tr -d \"')'\" | tr ',' '\n' | sed 's/^ //' || true)
              RAW=\$(python /ci_scripts/merge_test_results.py '${PREV_SHA}' '${PYTORCH_SHA}' --pytorch-dir /pytorch --category cpu --commands-only 2>/dev/null) || true
              while IFS= read -r line; do
                [ -z \"\$line\" ] && continue
                TEST_NAME=\$(echo \"\$line\" | sed -n 's/.*-i \([^ ]*\).*/\1/p')
                if [ -z \"\$TEST_NAME\" ] || echo \"\$VALID_TESTS\" | grep -qxF \"\$TEST_NAME\"; then
                  echo \"\$line\"
                fi
              done <<< \"\$RAW\"
            " 2>/dev/null || true)
            DELTA_TESTS=$(echo "${DELTA_TESTS}" | grep -v '\-i test_overrides' | sed '/^$/d')
            if [ -n "${DELTA_TESTS}" ]; then
              CRITICAL=$(python3 scripts/test_config.py cpu --critical --commands-only)
              COMMANDS=$(printf '%s\n%s' "${CRITICAL}" "${DELTA_TESTS}" | awk '!seen[$0]++' | sed '/^$/d')
              MODE="delta"
            fi
          fi

          case "${TEST_TIER}" in
            sanity) TIER_FLAG=--sanity ;;
            critical) TIER_FLAG=--critical ;;
            full) TIER_FLAG="" ;;
            delta) TIER_FLAG=--critical ;;
            *)
              echo "::error::Unsupported CPU test tier: ${TEST_TIER}"
              exit 1
              ;;
          esac
          if [ -z "${COMMANDS}" ]; then
            COMMANDS=$(python3 scripts/test_config.py cpu ${TIER_FLAG} --commands-only)
          fi
          echo "cpu_tests=$(echo "${COMMANDS}" | base64 -w0)" >> "$GITHUB_OUTPUT"
          echo "count=$(echo "${COMMANDS}" | sed '/^$/d' | wc -l)" >> "$GITHUB_OUTPUT"
          echo "mode=${MODE}" >> "$GITHUB_OUTPUT"

      - name: Determination summary
        run: |
          echo "## CRCR Nightly: CPU Test Determination" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Mode | \`${{ steps.resolve.outputs.mode }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Strategy | heuristic + structural (union) |" >> $GITHUB_STEP_SUMMARY
          echo "| Current SHA | \`${PYTORCH_SHA:0:10}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Previous SHA | \`${PREV_SHA:0:10}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| CPU tests | ${{ steps.resolve.outputs.count }} |" >> $GITHUB_STEP_SUMMARY

  determine-cuda-tests:
    name: "linux-rhel9.6-cuda13.0-py3.12-gcc11-x86_64 / determine-tests"
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' && (github.event_name == 'schedule' || inputs.run_scope == 'all' || inputs.run_scope == 'cuda') }}
    runs-on: linux.rhel96
    timeout-minutes: 600
    outputs:
      inductor_tests: ${{ steps.resolve.outputs.inductor_tests }}
      sgpu_tests: ${{ steps.resolve.outputs.sgpu_tests }}
      mgpu_tests: ${{ steps.resolve.outputs.mgpu_tests }}
      mode: ${{ steps.resolve.outputs.mode }}
    env:
      IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
      PYTORCH_SHA: ${{ needs.build.outputs.sha }}
      PREV_SHA: ${{ needs.build.outputs.prev_sha }}
    steps:
      - name: Checkout CI repo
        uses: actions/checkout@v4

      - name: Resolve test lists
        id: resolve
        run: |
          MODE="full"
          # Tests that unconditionally require a working CUDA driver
          # (they call torch.Stream() or similar without guarding)
          CUDA_ONLY_TESTS="test_overrides"

          if [ "${TEST_TIER}" = "delta" ] && [ -n "${PREV_SHA}" ]; then
            echo "Delta mode: comparing ${PREV_SHA:0:10}..${PYTORCH_SHA:0:10}"
            # Heuristic + structural analysis (C++ call graph is
            # pre-built and cached inside the image after the first run)
            ALL_RESULTS=$(podman run --rm -v "$(pwd)/scripts:/ci_scripts:ro" "${IMAGE_TAG}" bash -c "
              source /miniconda/etc/profile.d/conda.sh && conda activate cuda_torch_build
              cd /pytorch
              # Build valid test name list from run_test.py
              VALID_TESTS=\$(python test/run_test.py -i __probe__ 2>&1 | grep 'invalid choice' | sed \"s/.*choose from //\" | tr -d \")'\" | tr ',' '\n' | sed 's/^ //' || true)
              for cat in inductor sgpu mgpu; do
                RAW=\$(python /ci_scripts/merge_test_results.py '${PREV_SHA}' '${PYTORCH_SHA}' --pytorch-dir /pytorch --category \$cat --commands-only 2>/dev/null) || true
                # Filter: keep only commands whose -i test name is in VALID_TESTS
                CMDS=\"\"
                while IFS= read -r line; do
                  [ -z \"\$line\" ] && continue
                  TEST_NAME=\$(echo \"\$line\" | sed -n 's/.*-i \([^ ]*\).*/\1/p')
                  if [ -z \"\$TEST_NAME\" ] || echo \"\$VALID_TESTS\" | grep -qxF \"\$TEST_NAME\"; then
                    CMDS=\"\${CMDS}\${line}\n\"
                  fi
                done <<< \"\$RAW\"
                echo \":::\${cat}:::\"
                echo -e \"\$CMDS\"
              done
            ") || true
            echo "Raw output from container:"
            echo "$ALL_RESULTS"

            # Parse results by category delimiter
            for cat in inductor sgpu mgpu; do
              CMDS=$(echo "$ALL_RESULTS" | sed -n "/:::${cat}:::/,/:::.*:::/{ /:::/d; p; }" | sed '/^$/d')
              # Exclude CUDA-only tests from the inductor category.
              if [ "$cat" = "inductor" ]; then
                FILTERED=""
                while IFS= read -r line; do
                  [ -z "$line" ] && continue
                  SKIP=false
                  for excl in $CUDA_ONLY_TESTS; do
                    if echo "$line" | grep -q "\-i ${excl}"; then
                      SKIP=true
                      break
                    fi
                  done
                  if [ "$SKIP" = "false" ]; then
                    FILTERED="${FILTERED}${line}\n"
                  fi
                done <<< "$CMDS"
                CMDS=$(echo -e "$FILTERED" | sed '/^$/d')
              fi
              if [ -n "$CMDS" ]; then
                MODE="delta"
              fi
              echo "${cat}_tests=$(echo "$CMDS" | base64 -w0)" >> "$GITHUB_OUTPUT"
            done
          fi

          # Resolve final test list per category
          TIER_FLAG=""
          case "${TEST_TIER}" in
            sanity)   TIER_FLAG="--sanity" ;;
            critical) TIER_FLAG="--critical" ;;
            full)     TIER_FLAG="" ;;
            delta)    TIER_FLAG="--critical" ;;  # fallback when delta produces nothing
          esac

          for cat in inductor sgpu mgpu; do
            VAR="${cat}_tests"
            CURRENT=$(grep "^${VAR}=" "$GITHUB_OUTPUT" 2>/dev/null | cut -d= -f2-)
            DECODED=$(echo "$CURRENT" | base64 -d 2>/dev/null || true)

            if [ -z "$DECODED" ]; then
              echo "No delta tests for ${cat}, using ${TEST_TIER} tier"
              if [ -n "$TIER_FLAG" ]; then
                MERGED=$(python3 scripts/test_config.py "${cat}" ${TIER_FLAG} --commands-only)
              else
                MERGED=$(python3 scripts/test_config.py "${cat}" --commands-only)
              fi
            else
              # Prepend critical tests to delta results, then dedup
              CRITICAL=$(python3 scripts/test_config.py "${cat}" --critical --commands-only)
              MERGED=$(printf '%s\n%s' "$CRITICAL" "$DECODED" | awk '!seen[$0]++' | sed '/^$/d')
            fi
            echo "${cat}_tests=$(echo "$MERGED" | base64 -w0)" >> "$GITHUB_OUTPUT"
          done

          echo "mode=${MODE}" >> "$GITHUB_OUTPUT"

      - name: Determination summary
        env:
          INDUCTOR_B64: ${{ steps.resolve.outputs.inductor_tests }}
          SGPU_B64: ${{ steps.resolve.outputs.sgpu_tests }}
          MGPU_B64: ${{ steps.resolve.outputs.mgpu_tests }}
        run: |
          echo "## CRCR Nightly: Test Determination" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Mode | \`${{ steps.resolve.outputs.mode }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Strategy | heuristic + structural (union) |" >> $GITHUB_STEP_SUMMARY
          echo "| Current SHA | \`${PYTORCH_SHA:0:10}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Previous SHA | \`${PREV_SHA:0:10}\` |" >> $GITHUB_STEP_SUMMARY
          for pair in "inductor:$INDUCTOR_B64" "sgpu:$SGPU_B64" "mgpu:$MGPU_B64"; do
            NAME="${pair%%:*}"
            B64="${pair#*:}"
            COUNT=$(echo "$B64" | base64 -d 2>/dev/null | grep -c '.' || echo 0)
            echo "| ${NAME} tests | ${COUNT} |" >> $GITHUB_STEP_SUMMARY
          done

  cpu-tests:
    name: "linux-rhel9.6-cpu-py3.12-x86_64 / test (cpu, linux.rhel96-cpu)"
    needs: [cpu-build, determine-cpu-tests]
    if: ${{ !cancelled() && needs.cpu-build.result == 'success' && needs.determine-cpu-tests.result == 'success' && (github.event_name == 'schedule' || inputs.run_scope == 'all' || inputs.run_scope == 'cpu') }}
    runs-on: linux.rhel96-cpu
    timeout-minutes: 1440
    env:
      IMAGE_TAG: ${{ needs.cpu-build.outputs.image_tag }}
      QUAY_TAG: ${{ needs.cpu-build.outputs.quay_tag }}
      IMAGE_PUSHED: ${{ needs.cpu-build.outputs.image_pushed }}
      PYTORCH_SHA: ${{ needs.cpu-build.outputs.sha }}
    steps:
      - name: Checkout CI repo
        uses: actions/checkout@v4

      - name: Restore CPU image when needed
        env:
          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
          QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
        run: |
          if podman image exists "${IMAGE_TAG}"; then
            exit 0
          fi
          if [ "${IMAGE_PUSHED}" != "true" ]; then
            echo "::error::The CPU image is not local and the Quay upload failed. Re-run after Quay is available."
            exit 1
          fi
          echo "${QUAY_PASSWORD}" | podman login quay.io -u "${QUAY_USERNAME}" --password-stdin
          podman pull "${QUAY_TAG}"
          podman tag "${QUAY_TAG}" "${IMAGE_TAG}"

      - name: Quick sanity gate
        run: |
          podman run --rm "${IMAGE_TAG}" bash -c '
            source /miniconda/etc/profile.d/conda.sh && conda activate cpu_torch_build
            cd /tmp
            python -c "
          import torch, tempfile, os
          print(f\"PyTorch {torch.__version__} loaded\")
          assert torch.version.cuda is None, torch.version.cuda
          assert not torch.cuda.is_available()
          z = torch.randn(64, 64) @ torch.randn(64, 64)
          assert z.shape == (64, 64)
          for dt in [torch.float32, torch.float64, torch.int32, torch.int64, torch.bfloat16]:
              assert torch.ones(8, dtype=dt).dtype == dt
          x = torch.randn(10, requires_grad=True)
          ((x ** 2).sum()).backward()
          assert x.grad is not None and x.grad.shape == x.shape
          m = torch.nn.Linear(16, 4)
          with tempfile.NamedTemporaryFile(suffix=\".pt\", delete=False) as f:
              torch.save(m.state_dict(), f.name)
              torch.nn.Linear(16, 4).load_state_dict(torch.load(f.name, weights_only=True))
              os.unlink(f.name)
          print(\"Quick sanity gate passed\")
          "
          '

      - name: Run CPU test suite
        id: cpu_run
        continue-on-error: true
        env:
          TEST_LIST_B64: ${{ needs.determine-cpu-tests.outputs.cpu_tests }}
        run: |
          COMMANDS=$(echo "$TEST_LIST_B64" | base64 -d)
          if [ -z "$COMMANDS" ]; then
            echo "No CPU tests to run"
            echo "passed=0" >> "$GITHUB_OUTPUT"
            echo "failed=0" >> "$GITHUB_OUTPUT"
            echo "errors=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CMD_COUNT=$(echo "$COMMANDS" | wc -l)
          echo "Running ${CMD_COUNT} CPU test command(s)"
          LOG=/tmp/cpu_test_output.log
          echo "$COMMANDS" > /tmp/cpu_test_commands.txt
          set +e
          podman run --rm \
            -e CONTINUE_THROUGH_ERROR=True \
            -v /tmp/cpu_test_commands.txt:/tmp/test_commands.txt:ro \
            "${IMAGE_TAG}" bash -c '
            source /miniconda/etc/profile.d/conda.sh && conda activate cpu_torch_build
            cd /pytorch
            PASSED=0; FAILED=0; ERRORS=""
            while IFS= read -r cmd; do
              [ -z "$cmd" ] && continue
              echo ""
              echo "============================================================"
              echo "Running: $cmd"
              echo "============================================================"
              echo "$cmd" > /tmp/_run.sh
              if timeout 7200 bash /tmp/_run.sh; then
                PASSED=$((PASSED + 1))
              else
                RC=$?
                FAILED=$((FAILED + 1))
                if [ $RC -eq 124 ]; then
                  ERRORS="${ERRORS}\n  TIMEOUT(2h): $cmd"
                else
                  ERRORS="${ERRORS}\n  FAIL: $cmd"
                fi
              fi
            done < /tmp/test_commands.txt
            echo ""
            echo ":::SUMMARY:::"
            echo "PASSED=${PASSED}"
            echo "FAILED=${FAILED}"
            if [ $FAILED -gt 0 ]; then
              echo -e "ERRORS=${ERRORS}"
            fi
          ' 2>&1 | tee "$LOG"
          PODMAN_STATUS=${PIPESTATUS[0]}
          set -e

          if [ "${PODMAN_STATUS}" -ne 0 ] || ! grep -q '^:::SUMMARY:::' "$LOG"; then
            echo "passed=0" >> "$GITHUB_OUTPUT"
            echo "failed=1" >> "$GITHUB_OUTPUT"
            echo "errors=Container test harness failed before producing a summary." >> "$GITHUB_OUTPUT"
            exit 1
          fi

          PASSED=$(grep '^PASSED=' "$LOG" | tail -1 | cut -d= -f2)
          FAILED=$(grep '^FAILED=' "$LOG" | tail -1 | cut -d= -f2)
          FAIL_LIST=$(grep -E '^[[:space:]]*(FAIL:|TIMEOUT\([0-9]+h\):)' "$LOG" || true)
          echo "passed=${PASSED:-0}" >> "$GITHUB_OUTPUT"
          echo "failed=${FAILED:-0}" >> "$GITHUB_OUTPUT"
          {
            echo 'errors<<ERRORS_EOF'
            echo "$FAIL_LIST"
            echo 'ERRORS_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Test summary
        if: always()
        env:
          ERRORS_OUTPUT: ${{ steps.cpu_run.outputs.errors }}
        run: |
          echo "## CRCR Nightly: RHEL 9.6 — CPU Tests" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Nightly SHA | [\`${PYTORCH_SHA}\`](https://github.com/pytorch/pytorch/commit/${PYTORCH_SHA}) |" >> $GITHUB_STEP_SUMMARY
          echo "| Test tier | \`${TEST_TIER}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Commands | ${{ needs.determine-cpu-tests.outputs.cpu_count || '0' }} |" >> $GITHUB_STEP_SUMMARY
          FAILED="${{ steps.cpu_run.outputs.failed || '0' }}"
          echo "| Passed | ${{ steps.cpu_run.outputs.passed || '—' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Failed | ${FAILED} |" >> $GITHUB_STEP_SUMMARY
          if [ "${FAILED}" -gt 0 ] 2>/dev/null; then
            echo "| Result | \`completed with failures\` |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Result | \`success\` |" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -n "$ERRORS_OUTPUT" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Failed Commands" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "$ERRORS_OUTPUT" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Determine conclusion
        id: conclusion
        if: always()
        env:
          FAILED: ${{ steps.cpu_run.outputs.failed }}
        run: |
          if [ -n "$FAILED" ] && [ "$FAILED" != "0" ]; then
            echo "value=failure" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ job.status }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Report to CRCR
        if: ${{ always() && (github.event_name == 'schedule' || inputs.forward_to_hud) }}
        continue-on-error: true
        uses: pytorch/test-infra/.github/actions/cross-repo-ci-relay-callback@main
        with:
          status: completed
          conclusion: ${{ steps.conclusion.outputs.value }}
          delivery-id: ${{ needs.cpu-build.outputs.sha }}
          event-type: nightly
          job-name: "linux-rhel9.6-cpu-py3.12-x86_64 / test (cpu, linux.rhel96-cpu)"


