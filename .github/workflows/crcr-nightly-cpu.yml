name: "CRCR CPU: RHEL 9.6 Experimental Build & Test"

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "pytorch/pytorch SHA to build (leave empty for the latest nightly source SHA)"
        required: false
        default: ""
      test_tier:
        description: "sanity = quick list; critical = main nightly CPU baseline; build-only = skip tests"
        required: true
        type: choice
        default: critical
        options:
          - sanity
          - critical
          - build-only
      push_image:
        description: "Push an isolated experimental image so the CPU test job can run on another runner"
        required: true
        type: boolean
        default: true
      no_cache:
        description: "Force a fresh podman build for repeat CPU validation"
        required: true
        type: boolean
        default: true

run-name: >-
  [CPU experiment] RHEL 9.6 @ ${{ inputs.sha || 'latest-nightly' }}
  [${{ inputs.test_tier }}]

env:
  UPSTREAM_REPO: pytorch/pytorch
  NIGHTLY_BRANCH: nightly
  QUAY_REGISTRY: quay.io/aipcc/pytorch

permissions:
  contents: read

jobs:
  cpu-build:
    name: "linux-rhel9.6-cpu-py3.12-x86_64 / experimental build"
    runs-on: linux.rhel96-cpu
    timeout-minutes: 600
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      image_tag: ${{ steps.source.outputs.image_tag }}
      quay_tag: ${{ steps.source.outputs.quay_tag }}
      image_pushed: ${{ steps.image_publish.outputs.pushed }}
    steps:
      - name: Checkout CI repo
        uses: actions/checkout@v4

      - name: Resolve source SHA
        id: source
        env:
          INPUT_SHA: ${{ inputs.sha }}
        run: |
          if [ -n "${INPUT_SHA}" ]; then
            SOURCE_SHA="${INPUT_SHA}"
          else
            NIGHTLY_SHA=$(curl -fsSL "https://api.github.com/repos/${UPSTREAM_REPO}/commits?sha=${NIGHTLY_BRANCH}&per_page=1" | jq -r '.[0].sha')
            if [ -z "${NIGHTLY_SHA}" ] || [ "${NIGHTLY_SHA}" = "null" ]; then
              echo "::error::Could not resolve HEAD for ${UPSTREAM_REPO}/${NIGHTLY_BRANCH}"
              exit 1
            fi

            SOURCE_SHA=$(curl -fsSL "https://api.github.com/repos/${UPSTREAM_REPO}/commits/${NIGHTLY_SHA}" | jq -r '.commit.message' | grep -oP '\([a-f0-9]{40}\)' | tr -d '()')
          fi

          if ! [[ "${SOURCE_SHA}" =~ ^[a-f0-9]{40}$ ]]; then
            echo "::error::Expected a 40-character PyTorch source SHA; received '${SOURCE_SHA}'"
            exit 1
          fi

          SHORT_SHA=${SOURCE_SHA:0:7}
          IMAGE_TAG="rhel9-pytorch-cpu-experimental:${SOURCE_SHA}"
          QUAY_TAG="${QUAY_REGISTRY}:rhel9_6_pytorch_nightly_main_git${SHORT_SHA}_cpu_experimental"

          echo "sha=${SOURCE_SHA}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "quay_tag=${QUAY_TAG}" >> "$GITHUB_OUTPUT"

      - name: Log in to Quay.io
        if: inputs.push_image
        env:
          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
          QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
        run: echo "$QUAY_PASSWORD" | podman login quay.io -u "$QUAY_USERNAME" --password-stdin

      - name: Build CPU container image
        env:
          IMAGE_TAG: ${{ steps.source.outputs.image_tag }}
          PYTORCH_SHA: ${{ steps.source.outputs.sha }}
          SUBSCRIPTION_KEY: ${{ secrets.RHEL_SUBSCRIPTION_ACTIVATION_KEY }}
          SUBSCRIPTION_ORG: ${{ secrets.RHEL_SUBSCRIPTION_ORG_ID }}
          NO_CACHE: ${{ inputs.no_cache }}
        run: |
          umask 077
          KEY_FILE=$(mktemp)
          ORG_FILE=$(mktemp)
          cleanup() {
            rm -f "${KEY_FILE}" "${ORG_FILE}"
          }
          trap cleanup EXIT
          printf '%s' "${SUBSCRIPTION_KEY}" > "${KEY_FILE}"
          printf '%s' "${SUBSCRIPTION_ORG}" > "${ORG_FILE}"

          BUILD_ARGS=(
            --file docker/Dockerfile.rhel9-cpu
            --build-arg COMMIT_HASH="${PYTORCH_SHA}"
            --build-arg ENABLE_SUBSCRIPTION=true
            --build-arg RHEL_OS_VERSION=9.6
            --secret id=subscription_key,src="${KEY_FILE}"
            --secret id=subscription_org,src="${ORG_FILE}"
          )
          if [ "${NO_CACHE}" = "true" ]; then
            BUILD_ARGS+=(--no-cache)
          fi

          podman build \
            "${BUILD_ARGS[@]}" \
            --tag "${IMAGE_TAG}" \
            .

      - name: Verify CPU-only build
        env:
          IMAGE_TAG: ${{ steps.source.outputs.image_tag }}
        run: |
          podman run --rm "${IMAGE_TAG}" bash -c '
            source /miniconda/etc/profile.d/conda.sh && conda activate cpu_torch_build
            cd /tmp
            python -c "
          import torch
          assert torch.version.cuda is None, torch.version.cuda
          assert not torch.cuda.is_available()
          result = torch.randn(64, 64) @ torch.randn(64, 64)
          assert result.shape == (64, 64)
          print(f\"CPU-only PyTorch {torch.__version__} loaded successfully\")
          "
          '

      - name: Tag and push isolated experimental image
        id: quay_push
        if: inputs.push_image
        continue-on-error: true
        env:
          IMAGE_TAG: ${{ steps.source.outputs.image_tag }}
          QUAY_TAG: ${{ steps.source.outputs.quay_tag }}
        run: |
          podman tag "${IMAGE_TAG}" "${QUAY_TAG}"
          podman push "${QUAY_TAG}"

      - name: Record image publication result
        id: image_publish
        if: always()
        run: echo "pushed=${{ steps.quay_push.outcome == 'success' }}" >> "$GITHUB_OUTPUT"

      - name: Build summary
        if: always()
        env:
          PYTORCH_SHA: ${{ steps.source.outputs.sha }}
          IMAGE_TAG: ${{ steps.source.outputs.image_tag }}
          QUAY_TAG: ${{ steps.source.outputs.quay_tag }}
          IMAGE_PUSHED: ${{ steps.image_publish.outputs.pushed }}
          NO_CACHE: ${{ inputs.no_cache }}
        run: |
          echo "## Experimental RHEL 9.6 CPU build" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Property | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Source SHA | [\`${PYTORCH_SHA}\`](https://github.com/pytorch/pytorch/commit/${PYTORCH_SHA}) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Local image | \`${IMAGE_TAG}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Isolated Quay tag | \`${QUAY_TAG}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Image published | \`${IMAGE_PUSHED}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Fresh build | \`${NO_CACHE}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "This manual validation workflow does not report results to CRCR or HUD." >> "$GITHUB_STEP_SUMMARY"

  cpu-tests:
    name: "linux-rhel9.6-cpu-py3.12-x86_64 / experimental CPU tests"
    needs: cpu-build
    if: ${{ !cancelled() && needs.cpu-build.result == 'success' && inputs.test_tier != 'build-only' }}
    runs-on: linux.rhel96-cpu
    timeout-minutes: 1440
    env:
      IMAGE_TAG: ${{ needs.cpu-build.outputs.image_tag }}
      QUAY_TAG: ${{ needs.cpu-build.outputs.quay_tag }}
      IMAGE_PUSHED: ${{ needs.cpu-build.outputs.image_pushed }}
      PYTORCH_SHA: ${{ needs.cpu-build.outputs.sha }}
    steps:
      - name: Checkout CI repo
        uses: actions/checkout@v4

      - name: Restore experimental CPU image when needed
        env:
          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
          QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
        run: |
          if podman image exists "${IMAGE_TAG}"; then
            exit 0
          fi
          if [ "${IMAGE_PUSHED}" != "true" ]; then
            echo "::error::The CPU image is not local and the isolated image was not published. Re-run with push_image enabled."
            exit 1
          fi
          echo "${QUAY_PASSWORD}" | podman login quay.io -u "${QUAY_USERNAME}" --password-stdin
          podman pull "${QUAY_TAG}"
          podman tag "${QUAY_TAG}" "${IMAGE_TAG}"

      - name: Resolve CPU test list
        id: tests
        env:
          TEST_TIER: ${{ inputs.test_tier }}
        run: |
          case "${TEST_TIER}" in
            sanity) TIER_FLAG=--sanity ;;
            critical) TIER_FLAG=--critical ;;
            *)
              echo "::error::Unsupported CPU test tier: ${TEST_TIER}"
              exit 1
              ;;
          esac
          COMMANDS=$(python3 scripts/test_config.py cpu "${TIER_FLAG}" --commands-only)
          printf '%s' "${COMMANDS}" | base64 -w 0 > /tmp/cpu_test_list.b64
          echo "commands_b64=$(cat /tmp/cpu_test_list.b64)" >> "$GITHUB_OUTPUT"
          echo "count=$(printf '%s\\n' "${COMMANDS}" | sed '/^$/d' | wc -l)" >> "$GITHUB_OUTPUT"

      - name: Run CPU test suite
        id: cpu_run
        continue-on-error: true
        env:
          TEST_LIST_B64: ${{ steps.tests.outputs.commands_b64 }}
        run: |
          COMMANDS=$(printf '%s' "${TEST_LIST_B64}" | base64 -d)
          if [ -z "${COMMANDS}" ]; then
            echo "passed=0" >> "$GITHUB_OUTPUT"
            echo "failed=0" >> "$GITHUB_OUTPUT"
            echo "errors=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          printf '%s\\n' "${COMMANDS}" > /tmp/cpu_test_commands.txt
          LOG=/tmp/cpu_test_output.log
          set +e
          podman run --rm \
            -e CONTINUE_THROUGH_ERROR=True \
            -v /tmp/cpu_test_commands.txt:/tmp/test_commands.txt:ro \
            "${IMAGE_TAG}" bash -c '
              source /miniconda/etc/profile.d/conda.sh && conda activate cpu_torch_build
              cd /pytorch
              PASSED=0; FAILED=0; ERRORS=""
              while IFS= read -r cmd; do
                [ -z "$cmd" ] && continue
                echo "Running: $cmd"
                printf "%s\\n" "$cmd" > /tmp/_run.sh
                if timeout 7200 bash /tmp/_run.sh; then
                  PASSED=$((PASSED + 1))
                else
                  rc=$?
                  FAILED=$((FAILED + 1))
                  if [ "$rc" -eq 124 ]; then
                    ERRORS="${ERRORS}\\nTIMEOUT(2h): $cmd"
                  else
                    ERRORS="${ERRORS}\\nFAIL: $cmd"
                  fi
                fi
              done < /tmp/test_commands.txt
              echo ":::SUMMARY:::"
              echo "PASSED=${PASSED}"
              echo "FAILED=${FAILED}"
              [ "$FAILED" -eq 0 ] || echo -e "ERRORS=${ERRORS}"
            ' 2>&1 | tee "${LOG}"
          PODMAN_STATUS=${PIPESTATUS[0]}
          set -e

          if [ "${PODMAN_STATUS}" -ne 0 ] || ! grep -q '^:::SUMMARY:::' "${LOG}"; then
            echo "passed=0" >> "$GITHUB_OUTPUT"
            echo "failed=1" >> "$GITHUB_OUTPUT"
            echo "errors=Container test harness failed before producing a summary." >> "$GITHUB_OUTPUT"
            exit 1
          fi

          PASSED=$(grep '^PASSED=' "${LOG}" | tail -1 | cut -d= -f2)
          FAILED=$(grep '^FAILED=' "${LOG}" | tail -1 | cut -d= -f2)
          FAIL_LIST=$(grep -E '^(FAIL|TIMEOUT)' "${LOG}" || true)
          echo "passed=${PASSED:-0}" >> "$GITHUB_OUTPUT"
          echo "failed=${FAILED:-0}" >> "$GITHUB_OUTPUT"
          {
            echo 'errors<<ERRORS_EOF'
            echo "${FAIL_LIST}"
            echo 'ERRORS_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Test summary
        if: always()
        env:
          TEST_TIER: ${{ inputs.test_tier }}
          PASSED: ${{ steps.cpu_run.outputs.passed }}
          FAILED: ${{ steps.cpu_run.outputs.failed }}
          ERRORS: ${{ steps.cpu_run.outputs.errors }}
        run: |
          echo "## Experimental RHEL 9.6 CPU tests" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Property | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Source SHA | [\`${PYTORCH_SHA}\`](https://github.com/pytorch/pytorch/commit/${PYTORCH_SHA}) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Tier | \`${TEST_TIER}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Commands | ${{ steps.tests.outputs.count || '0' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Passed | ${PASSED:-0} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Failed | ${FAILED:-0} |" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "${ERRORS}" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "### Failed commands" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "${ERRORS}" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Fail workflow when CPU tests fail
        if: ${{ steps.cpu_run.outputs.failed != '0' }}
        run: exit 1
