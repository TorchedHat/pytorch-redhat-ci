name: "Validation: RHEL 9.8 + CUDA 13.2"

on:
  push:
    branches:
      - rhel98-cuda132-validation
  workflow_dispatch:
    inputs:
      pytorch_sha:
        description: "PyTorch commit SHA to build (leave empty for current main)"
        required: false
        type: string
      no_cache:
        description: "Build without using cached container layers"
        required: false
        default: true
        type: boolean

run-name: >-
  [Validation] RHEL 9.8 + CUDA 13.2 @ ${{ inputs.pytorch_sha || 'current main' }}

permissions:
  contents: read

concurrency:
  group: rhel98-cuda132-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: linux.rhel96
    timeout-minutes: 300
    env:
      PYTORCH_REPO: pytorch/pytorch
      RHEL_OS_VERSION: "9.8"
      CUDA_VERSION: "13-2"
    steps:
      - name: Checkout CI repository
        uses: actions/checkout@v4

      - name: Resolve PyTorch SHA
        id: source
        env:
          REQUESTED_SHA: ${{ inputs.pytorch_sha }}
        run: |
          if [ -n "$REQUESTED_SHA" ]; then
            SHA="$REQUESTED_SHA"
          else
            SHA=$(curl -fsSL "https://api.github.com/repos/${PYTORCH_REPO}/commits/main" | jq -r '.sha')
          fi

          if ! [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Could not resolve a PyTorch commit SHA"
            exit 1
          fi

          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "image_tag=rhel9_8_cuda13_2-pytorch-validation:${SHA}" >> "$GITHUB_OUTPUT"

      - name: Build RHEL 9.8 CUDA 13.2 image
        env:
          IMAGE_TAG: ${{ steps.source.outputs.image_tag }}
          PYTORCH_SHA: ${{ steps.source.outputs.sha }}
          NO_CACHE: ${{ inputs.no_cache }}
          SUBSCRIPTION_KEY: ${{ secrets.RHEL_SUBSCRIPTION_ACTIVATION_KEY }}
          SUBSCRIPTION_ORG: ${{ secrets.RHEL_SUBSCRIPTION_ORG_ID }}
        run: |
          printf '%s' "$SUBSCRIPTION_KEY" > /tmp/sub_key.txt
          printf '%s' "$SUBSCRIPTION_ORG" > /tmp/sub_org.txt
          trap 'rm -f /tmp/sub_key.txt /tmp/sub_org.txt' EXIT

          build_args=(
            --file docker/Dockerfile.rhel9
            --build-arg COMMIT_HASH="${PYTORCH_SHA}"
            --build-arg ENABLE_SUBSCRIPTION=true
            --build-arg RHEL_OS_VERSION="${RHEL_OS_VERSION}"
            --build-arg CUDA_VERSION="${CUDA_VERSION}"
            --secret id=subscription_key,src=/tmp/sub_key.txt
            --secret id=subscription_org,src=/tmp/sub_org.txt
            --tag "${IMAGE_TAG}"
          )

          if [ "$NO_CACHE" = "true" ]; then
            build_args+=(--no-cache)
          fi

          podman build "${build_args[@]}" .

      - name: Verify OS, CUDA toolkit, and PyTorch import
        env:
          IMAGE_TAG: ${{ steps.source.outputs.image_tag }}
        run: |
          podman run --rm "${IMAGE_TAG}" bash -eu -c '
            . /etc/os-release
            test "$VERSION_ID" = "9.8"
            nvcc --version | grep -F "release 13.2"
            source /miniconda/etc/profile.d/conda.sh
            conda activate cuda_torch_build
            cd /tmp
            python -c "import torch; cuda = torch.version.cuda; assert cuda is not None; assert cuda.startswith(\"13.2\"), cuda; print(f\"PyTorch {torch.__version__} imports with CUDA {cuda}\")"
          '

      - name: Run CPU smoke tests
        env:
          IMAGE_TAG: ${{ steps.source.outputs.image_tag }}
        run: |
          podman run --rm "${IMAGE_TAG}" bash -eu -c '
            source /miniconda/etc/profile.d/conda.sh
            conda activate cuda_torch_build
            cd /pytorch
            python test/run_test.py -i test_torch test_autograd -v
          '

      - name: Run CUDA smoke test when a GPU is available
        env:
          IMAGE_TAG: ${{ steps.source.outputs.image_tag }}
        run: |
          if ! nvidia-smi >/dev/null 2>&1; then
            echo "No NVIDIA GPU is available on the runner; CUDA runtime smoke test skipped."
            exit 0
          fi

          podman run --rm --device nvidia.com/gpu=all "${IMAGE_TAG}" bash -eu -c '
            source /miniconda/etc/profile.d/conda.sh
            conda activate cuda_torch_build
            cd /tmp
            python -c "
            import torch
            assert torch.cuda.is_available()
            x = torch.randn(64, 64, device=\"cuda\")
            y = x @ x
            torch.cuda.synchronize()
            assert y.is_cuda and y.shape == (64, 64)
            print(torch.cuda.get_device_name(0))
            "
          '

      - name: Publish validation summary
        if: always()
        env:
          IMAGE_TAG: ${{ steps.source.outputs.image_tag }}
          PYTORCH_SHA: ${{ steps.source.outputs.sha }}
        run: |
          echo "## RHEL 9.8 + CUDA 13.2 validation" >> "$GITHUB_STEP_SUMMARY"
          echo "| Property | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          echo "| PyTorch SHA | \`${PYTORCH_SHA}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Container image | \`${IMAGE_TAG}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| CRCR/HUD callback | disabled |" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove validation image
        if: always()
        env:
          IMAGE_TAG: ${{ steps.source.outputs.image_tag }}
        run: podman rmi "${IMAGE_TAG}" 2>/dev/null || true
