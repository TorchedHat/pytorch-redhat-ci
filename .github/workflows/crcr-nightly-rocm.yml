name: "CRCR Nightly: RHEL 9.6 ROCm Build & Test"

# Manual-only while the linux.rhel96-rocm runner and image are being validated.
# Cron can be enabled once build/test are stable and HUD reporting is turned on.
on:
  workflow_dispatch:
    inputs:
      sha:
        description: "pytorch/pytorch SHA to build against (leave empty for latest nightly)"
        required: false
        default: ""
      test_tier:
        description: "sanity = quick lists from test_config; critical = full critical suites; build-only = skip tests"
        required: false
        type: choice
        default: "critical"
        options:
          - sanity
          - critical
          - build-only
      test_categories:
        description: "Which ROCm test categories to run (MI355X: inductor + sgpu + mgpu)"
        required: false
        type: choice
        default: "all"
        options:
          - all
          - inductor
          - sgpu
          - mgpu
      no_cache:
        description: "Force podman --no-cache rebuild (recommended until ROCm image is validated)"
        required: false
        type: boolean
        default: true

run-name: >-
  [Nightly] RHEL 9.6 ROCm @ ${{ inputs.sha && format('manual ({0})', inputs.sha) || 'manual' }} [${{ inputs.test_tier }}/${{ inputs.test_categories }}]

env:
  UPSTREAM_REPO: pytorch/pytorch
  NIGHTLY_BRANCH: nightly
  QUAY_REGISTRY: quay.io/aipcc/pytorch
  ROCM_VERSION: "7.14.0"
  PYTORCH_ROCM_ARCH: "gfx90a;gfx942;gfx950;gfx1100"
  # Keep HUD/CRCR callbacks off until the ROCm pipeline is manually validated.
  PUSH_TO_HUD: "false"
  # HSA "Memory in use" under rootless podman is fixed by --ipc=host (do not also set --shm-size).
  PODMAN_ROCM_ARGS: >-
    --ipc=host
    --device=/dev/kfd
    --device=/dev/dri
    --group-add=video
    --group-add=render
    --security-opt=seccomp=unconfined

permissions:
  contents: read
  id-token: write

jobs:
  rocm-build:
    name: "linux-rhel9.6-rocm7.14.0-py3.12-gcc11-x86_64 / build"
    runs-on: linux.rhel96-rocm
    timeout-minutes: 600
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
      image_tag: ${{ steps.sha.outputs.image_tag }}
      quay_tag: ${{ steps.sha.outputs.quay_tag }}
    steps:
      - name: Checkout CI repo
        uses: actions/checkout@v4

      - name: Fetch source SHA from nightly branch
        id: sha
        env:
          INPUT_SHA: ${{ inputs.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          github_api() {
            local url="$1"
            curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$url"
          }

          if [ -n "$INPUT_SHA" ]; then
            echo "Using manually provided SHA: $INPUT_SHA"
            SOURCE_SHA="$INPUT_SHA"
          else
            # Authenticated API avoids unauthenticated 403/rate-limit on self-hosted runners.
            API_JSON=$(github_api "https://api.github.com/repos/${UPSTREAM_REPO}/commits?sha=${NIGHTLY_BRANCH}&per_page=1" || true)
            NIGHTLY_SHA=$(echo "$API_JSON" | jq -r '.[0].sha // empty')

            if [ -z "$NIGHTLY_SHA" ]; then
              echo "::warning::GitHub API failed; falling back to git ls-remote"
              NIGHTLY_SHA=$(git ls-remote "https://github.com/${UPSTREAM_REPO}.git" "refs/heads/${NIGHTLY_BRANCH}" | awk '{print $1}')
            fi

            if [ -z "$NIGHTLY_SHA" ]; then
              echo "::error::Could not resolve HEAD for ${UPSTREAM_REPO}/${NIGHTLY_BRANCH}"
              exit 1
            fi

            COMMIT_MSG=$(github_api "https://api.github.com/repos/${UPSTREAM_REPO}/commits/${NIGHTLY_SHA}" | jq -r '.commit.message // empty' || true)
            if [ -z "$COMMIT_MSG" ]; then
              COMMIT_MSG=$(curl -fsSL "https://github.com/${UPSTREAM_REPO}/commit/${NIGHTLY_SHA}.patch" | head -n 20 || true)
            fi

            SOURCE_SHA=$(echo "$COMMIT_MSG" | grep -oP '\(([a-f0-9]{40})\)' | tr -d '()' | head -1)
            if [ -z "$SOURCE_SHA" ]; then
              echo "::error::Could not extract source SHA from nightly commit ${NIGHTLY_SHA}"
              echo "Commit message preview:"
              echo "$COMMIT_MSG" | head -n 5
              exit 1
            fi
          fi

          SHORT_SHA=${SOURCE_SHA:0:7}
          QUAY_TAG="${QUAY_REGISTRY}:rhel9_6_pytorch_nightly_main_git${SHORT_SHA}_rocm${ROCM_VERSION//./_}"

          echo "Source main SHA: $SOURCE_SHA"
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "image_tag=rhel9-pytorch-rocm-nightly:${SOURCE_SHA}" >> "$GITHUB_OUTPUT"
          echo "quay_tag=$QUAY_TAG" >> "$GITHUB_OUTPUT"
          echo "Quay tag: $QUAY_TAG"

      - name: Log in to Quay.io
        env:
          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
          QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
        run: |
          echo "$QUAY_PASSWORD" | podman login quay.io -u "$QUAY_USERNAME" --password-stdin

      - name: Build ROCm container image
        env:
          IMAGE_TAG: ${{ steps.sha.outputs.image_tag }}
          PYTORCH_SHA: ${{ steps.sha.outputs.sha }}
          SUBSCRIPTION_KEY: ${{ secrets.RHEL_SUBSCRIPTION_ACTIVATION_KEY }}
          SUBSCRIPTION_ORG: ${{ secrets.RHEL_SUBSCRIPTION_ORG_ID }}
          NO_CACHE: ${{ inputs.no_cache }}
        run: |
          echo "$SUBSCRIPTION_KEY" > /tmp/sub_key.txt
          echo "$SUBSCRIPTION_ORG" > /tmp/sub_org.txt

          # On subscribed RHEL runners, mount host entitlements so the
          # UBI build can use repos even if in-container register is blocked.
          VOLUME_ARGS=()
          if [ -d /etc/pki/entitlement ]; then
            VOLUME_ARGS+=(-v /etc/pki/entitlement:/etc/pki/entitlement:ro)
          fi
          if [ -d /etc/rhsm ]; then
            VOLUME_ARGS+=(-v /etc/rhsm:/etc/rhsm:ro)
          fi

          BUILD_ARGS=(
            --file docker/Dockerfile.rhel9-rocm
            --build-arg COMMIT_HASH="${PYTORCH_SHA}"
            --build-arg ENABLE_SUBSCRIPTION=true
            --build-arg RHEL_OS_VERSION=9.6
            --build-arg RHEL_GRAPHICS_VERSION=9.6
            --build-arg ROCM_VERSION="${ROCM_VERSION}"
            --build-arg ROCM_REPO_VERSION="26.13"
            --build-arg AMDGPU_INSTALL_VERSION="31.40"
            --build-arg PYTORCH_ROCM_ARCH="${PYTORCH_ROCM_ARCH}"
            --secret id=subscription_key,src=/tmp/sub_key.txt
            --secret id=subscription_org,src=/tmp/sub_org.txt
          )
          if [ "${NO_CACHE}" = "true" ]; then
            echo "Building with --no-cache (forced full rebuild)"
            BUILD_ARGS+=(--no-cache)
          fi

          podman build \
            "${BUILD_ARGS[@]}" \
            "${VOLUME_ARGS[@]}" \
            --tag "${IMAGE_TAG}" \
            .

          rm -f /tmp/sub_key.txt /tmp/sub_org.txt

      - name: Verify built image imports torch with HIP
        env:
          IMAGE_TAG: ${{ steps.sha.outputs.image_tag }}
        run: |
          # Guard against a cached/broken image that never compiled ROCm PyTorch.
          # Must cd out of /pytorch: wheel install leaves a source tree that shadows
          # site-packages when cwd is the repo root (same pattern as CUDA sanity).
          podman run --rm "${IMAGE_TAG}" bash -lc '
            source /miniconda/etc/profile.d/conda.sh
            conda activate rocm_torch_build
            cd /tmp
            python -c "import torch; print(f\"torch={torch.__version__} hip={torch.version.hip}\"); assert torch.version.hip, \"torch.version.hip empty - ROCm build missing\"; print(\"post-build HIP import smoke passed\")"
          '

      - name: Tag and push to Quay.io
        env:
          IMAGE_TAG: ${{ steps.sha.outputs.image_tag }}
          QUAY_TAG: ${{ steps.sha.outputs.quay_tag }}
        run: |
          podman tag "${IMAGE_TAG}" "${QUAY_TAG}"
          podman push "${QUAY_TAG}"
          echo "Pushed: ${QUAY_TAG}"

      - name: Build summary
        env:
          IMAGE_TAG: ${{ steps.sha.outputs.image_tag }}
          QUAY_TAG: ${{ steps.sha.outputs.quay_tag }}
          PYTORCH_SHA: ${{ steps.sha.outputs.sha }}
          NO_CACHE: ${{ inputs.no_cache }}
        run: |
          echo "## CRCR Nightly: RHEL 9.6 ROCm — Build" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Nightly SHA | [\`${PYTORCH_SHA}\`](https://github.com/pytorch/pytorch/commit/${PYTORCH_SHA}) |" >> $GITHUB_STEP_SUMMARY
          echo "| Local Image | \`${IMAGE_TAG}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Quay Image | \`${QUAY_TAG}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| no_cache | \`${NO_CACHE}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| HUD push | \`${PUSH_TO_HUD}\` |" >> $GITHUB_STEP_SUMMARY

      - name: Report to CRCR
        if: always() && env.PUSH_TO_HUD == 'true'
        continue-on-error: true
        uses: pytorch/test-infra/.github/actions/cross-repo-ci-relay-callback@main
        with:
          status: completed
          conclusion: ${{ job.status }}
          delivery-id: ${{ steps.sha.outputs.sha }}
          event-type: nightly
          job-name: "linux-rhel9.6-rocm7.14.0-py3.12-gcc11-x86_64 / build"

  determine-tests:
    name: "linux-rhel9.6-rocm7.14.0-py3.12-gcc11-x86_64 / determine-tests"
    needs: rocm-build
    if: ${{ !cancelled() && needs.rocm-build.result == 'success' && inputs.test_tier != 'build-only' }}
    runs-on: linux.rhel96-rocm
    timeout-minutes: 30
    outputs:
      inductor_tests: ${{ steps.resolve.outputs.inductor_tests }}
      sgpu_tests: ${{ steps.resolve.outputs.sgpu_tests }}
      mgpu_tests: ${{ steps.resolve.outputs.mgpu_tests }}
    steps:
      - name: Checkout CI repo
        uses: actions/checkout@v4

      - name: Resolve test lists from test_config.py
        id: resolve
        env:
          TEST_TIER: ${{ inputs.test_tier }}
        run: |
          TIER_FLAG="--critical"
          if [ "${TEST_TIER}" = "sanity" ]; then
            TIER_FLAG="--sanity"
          fi

          for cat in inductor sgpu mgpu; do
            CMDS=$(python3 scripts/test_config.py "${cat}" ${TIER_FLAG} --commands-only)
            COUNT=$(echo "$CMDS" | grep -cve '^[[:space:]]*$' || true)
            echo "${cat}: ${COUNT} command(s) (${TEST_TIER})"
            echo "$CMDS"
            echo "${cat}_tests=$(echo "$CMDS" | base64 -w0)" >> "$GITHUB_OUTPUT"
          done

      - name: Determination summary
        env:
          INDUCTOR_B64: ${{ steps.resolve.outputs.inductor_tests }}
          SGPU_B64: ${{ steps.resolve.outputs.sgpu_tests }}
          MGPU_B64: ${{ steps.resolve.outputs.mgpu_tests }}
        run: |
          echo "## CRCR Nightly: RHEL 9.6 ROCm — Test Determination" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Tier | \`${{ inputs.test_tier }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Categories | \`${{ inputs.test_categories }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Source | \`scripts/test_config.py\` (no delta yet) |" >> $GITHUB_STEP_SUMMARY
          for pair in "inductor:$INDUCTOR_B64" "sgpu:$SGPU_B64" "mgpu:$MGPU_B64"; do
            NAME="${pair%%:*}"
            B64="${pair#*:}"
            COUNT=$(echo "$B64" | base64 -d 2>/dev/null | grep -cve '^[[:space:]]*$' || echo 0)
            echo "| ${NAME} tests | ${COUNT} |" >> $GITHUB_STEP_SUMMARY
          done

  inductor-tests:
    name: "linux-rhel9.6-rocm7.14.0-py3.12-gcc11-x86_64 / test (inductor, linux.rhel96-rocm)"
    needs: [rocm-build, determine-tests]
    if: ${{ !cancelled() && needs.rocm-build.result == 'success' && needs.determine-tests.result == 'success' && (inputs.test_categories == 'all' || inputs.test_categories == 'inductor') }}
    runs-on: linux.rhel96-rocm
    timeout-minutes: 1440
    env:
      IMAGE_TAG: ${{ needs.rocm-build.outputs.image_tag }}
      PYTORCH_SHA: ${{ needs.rocm-build.outputs.sha }}
    steps:
      - name: Check AMD GPU availability
        id: gpu_check
        run: |
          if command -v rocm-smi &>/dev/null && rocm-smi &>/dev/null; then
            GPU_COUNT=$(rocm-smi -i 2>/dev/null | grep -c 'GPU\[' || true)
            if [ "${GPU_COUNT}" -eq 0 ]; then
              GPU_COUNT=$(rocm-smi --showid 2>/dev/null | grep -c 'GPU\[' || echo 1)
            fi
            echo "gpu_available=true" >> "$GITHUB_OUTPUT"
            echo "gpu_count=${GPU_COUNT}" >> "$GITHUB_OUTPUT"
            rocm-smi || true
          elif [ -e /dev/kfd ] && [ -e /dev/dri ]; then
            echo "gpu_available=true" >> "$GITHUB_OUTPUT"
            echo "gpu_count=1" >> "$GITHUB_OUTPUT"
            echo "Found /dev/kfd and /dev/dri — proceeding without rocm-smi"
          else
            echo "gpu_available=false" >> "$GITHUB_OUTPUT"
            echo "gpu_count=0" >> "$GITHUB_OUTPUT"
            echo "::warning::No AMD GPU detected — inductor GPU tests may be limited"
          fi

      - name: Verify image exists
        run: |
          if ! podman image exists "${IMAGE_TAG}"; then
            echo "::error::Image ${IMAGE_TAG} not found in local podman store"
            exit 1
          fi

      - name: Run inductor test suite
        id: inductor_run
        continue-on-error: true
        env:
          TEST_LIST_B64: ${{ needs.determine-tests.outputs.inductor_tests }}
        run: |
          COMMANDS=$(echo "$TEST_LIST_B64" | base64 -d)
          if [ -z "$COMMANDS" ]; then
            echo "No inductor tests to run"
            echo "passed=0" >> "$GITHUB_OUTPUT"
            echo "failed=0" >> "$GITHUB_OUTPUT"
            echo "errors=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CMD_COUNT=$(echo "$COMMANDS" | grep -cve '^[[:space:]]*$' || true)
          echo "Running ${CMD_COUNT} inductor test command(s)"
          LOG=/tmp/rocm_inductor_test_output.log
          echo "$COMMANDS" > /tmp/rocm_inductor_test_commands.txt
          chmod a+r /tmp/rocm_inductor_test_commands.txt

          # Mount ROCm devices when present so GPU inductor paths can run on MI355X.
          GPU_ARGS=()
          if [ "${{ steps.gpu_check.outputs.gpu_available }}" = "true" ]; then
            # shellcheck disable=SC2086
            GPU_ARGS=(${PODMAN_ROCM_ARGS} -e HIP_VISIBLE_DEVICES=0)
          fi

          podman run --rm \
            "${GPU_ARGS[@]}" \
            -e CONTINUE_THROUGH_ERROR=True \
            -v /tmp/rocm_inductor_test_commands.txt:/tmp/test_commands.txt:Z,ro \
            "${IMAGE_TAG}" bash -c '
            source /miniconda/etc/profile.d/conda.sh && conda activate rocm_torch_build
            cd /pytorch
            PASSED=0; FAILED=0; ERRORS=""
            while IFS= read -r cmd; do
              [ -z "$cmd" ] && continue
              echo ""
              echo "============================================================"
              echo "Running: $cmd"
              echo "============================================================"
              echo "$cmd" > /tmp/_run.sh
              if timeout 7200 bash /tmp/_run.sh; then
                PASSED=$((PASSED + 1))
              else
                RC=$?
                FAILED=$((FAILED + 1))
                if [ $RC -eq 124 ]; then
                  ERRORS="${ERRORS}\n  TIMEOUT(2h): $cmd"
                else
                  ERRORS="${ERRORS}\n  FAIL: $cmd"
                fi
              fi
            done < /tmp/test_commands.txt
            echo ""
            echo ":::SUMMARY:::"
            echo "PASSED=${PASSED}"
            echo "FAILED=${FAILED}"
            if [ $FAILED -gt 0 ]; then
              echo -e "ERRORS=${ERRORS}"
            fi
          ' 2>&1 | tee "$LOG" || true

          PASSED=$(grep '^PASSED=' "$LOG" | tail -1 | cut -d= -f2)
          FAILED=$(grep '^FAILED=' "$LOG" | tail -1 | cut -d= -f2)
          FAIL_LIST=$(grep '^\s*\(FAIL\|TIMEOUT\)' "$LOG" || true)

          if [ "${CMD_COUNT}" -gt 0 ] && [ "${PASSED:-0}" = "0" ] && [ "${FAILED:-0}" = "0" ]; then
            echo "::error::Resolved ${CMD_COUNT} inductor command(s) but executed none."
            FAILED="${CMD_COUNT}"
            FAIL_LIST="$(printf '  INFRA: zero commands executed\n%s' "${FAIL_LIST}")"
          fi

          echo "passed=${PASSED:-0}" >> "$GITHUB_OUTPUT"
          echo "failed=${FAILED:-0}" >> "$GITHUB_OUTPUT"
          {
            echo 'errors<<ERRORS_EOF'
            echo "$FAIL_LIST"
            echo 'ERRORS_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Test summary
        if: always()
        env:
          ERRORS_OUTPUT: ${{ steps.inductor_run.outputs.errors }}
        run: |
          echo "## CRCR Nightly: RHEL 9.6 ROCm — Inductor Tests" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Nightly SHA | [\`${PYTORCH_SHA}\`](https://github.com/pytorch/pytorch/commit/${PYTORCH_SHA}) |" >> $GITHUB_STEP_SUMMARY
          echo "| GPUs | ${{ steps.gpu_check.outputs.gpu_count }} |" >> $GITHUB_STEP_SUMMARY
          FAILED="${{ steps.inductor_run.outputs.failed || '0' }}"
          echo "| Passed | ${{ steps.inductor_run.outputs.passed || '—' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Failed | ${FAILED} |" >> $GITHUB_STEP_SUMMARY
          if [ "${FAILED}" -gt 0 ] 2>/dev/null; then
            echo "| Result | \`completed with failures\` |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Result | \`success\` |" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -n "$ERRORS_OUTPUT" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Failed Commands" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "$ERRORS_OUTPUT" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Determine conclusion
        id: conclusion
        if: always()
        env:
          FAILED: ${{ steps.inductor_run.outputs.failed }}
        run: |
          if [ -n "$FAILED" ] && [ "$FAILED" != "0" ]; then
            echo "value=failure" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ job.status }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Report to CRCR
        if: always() && env.PUSH_TO_HUD == 'true'
        continue-on-error: true
        uses: pytorch/test-infra/.github/actions/cross-repo-ci-relay-callback@main
        with:
          status: completed
          conclusion: ${{ steps.conclusion.outputs.value }}
          delivery-id: ${{ needs.rocm-build.outputs.sha }}
          event-type: nightly
          job-name: "linux-rhel9.6-rocm7.14.0-py3.12-gcc11-x86_64 / test (inductor, linux.rhel96-rocm)"

  sgpu-tests:
    name: "linux-rhel9.6-rocm7.14.0-py3.12-gcc11-x86_64 / test (sgpu, linux.rhel96-rocm)"
    needs: [rocm-build, determine-tests, inductor-tests]
    # Allow inductor skipped when test_categories=sgpu (or inductor failed soft).
    if: ${{ !cancelled() && needs.rocm-build.result == 'success' && needs.determine-tests.result == 'success' && (needs.inductor-tests.result == 'success' || needs.inductor-tests.result == 'skipped') && (inputs.test_categories == 'all' || inputs.test_categories == 'sgpu') }}
    runs-on: linux.rhel96-rocm
    timeout-minutes: 1440
    env:
      IMAGE_TAG: ${{ needs.rocm-build.outputs.image_tag }}
      PYTORCH_SHA: ${{ needs.rocm-build.outputs.sha }}
    steps:
      - name: Check AMD GPU availability
        id: gpu_check
        run: |
          if command -v rocm-smi &>/dev/null && rocm-smi &>/dev/null; then
            GPU_COUNT=$(rocm-smi -i 2>/dev/null | grep -c 'GPU\[' || true)
            if [ "${GPU_COUNT}" -eq 0 ]; then
              GPU_COUNT=$(rocm-smi --showid 2>/dev/null | grep -c 'GPU\[' || echo 1)
            fi
            echo "gpu_available=true" >> "$GITHUB_OUTPUT"
            echo "gpu_count=${GPU_COUNT}" >> "$GITHUB_OUTPUT"
            rocm-smi || true
          elif [ -e /dev/kfd ] && [ -e /dev/dri ]; then
            echo "gpu_available=true" >> "$GITHUB_OUTPUT"
            echo "gpu_count=1" >> "$GITHUB_OUTPUT"
            echo "Found /dev/kfd and /dev/dri — proceeding without rocm-smi"
          else
            echo "gpu_available=false" >> "$GITHUB_OUTPUT"
            echo "gpu_count=0" >> "$GITHUB_OUTPUT"
            echo "::warning::No AMD GPU detected — ROCm sgpu tests will be skipped"
          fi

      - name: Verify image exists
        if: steps.gpu_check.outputs.gpu_available == 'true'
        run: |
          if ! podman image exists "${IMAGE_TAG}"; then
            echo "::error::Image ${IMAGE_TAG} not found in local podman store"
            exit 1
          fi

      - name: Quick sanity gate
        if: steps.gpu_check.outputs.gpu_available == 'true'
        run: |
          # shellcheck disable=SC2086
          podman run --rm \
            ${PODMAN_ROCM_ARGS} \
            -e HIP_VISIBLE_DEVICES=0 \
            "${IMAGE_TAG}" bash -lc '
            source /miniconda/etc/profile.d/conda.sh && conda activate rocm_torch_build
            cd /tmp
            python - <<'"'"'PY'"'"'
          import torch, tempfile, os
          print(f"PyTorch {torch.__version__} hip={torch.version.hip}")
          assert torch.version.hip, "torch.version.hip empty"
          assert torch.cuda.is_available(), "HIP/ROCm device not available"
          z = torch.randn(64, 64) @ torch.randn(64, 64)
          assert z.shape == (64, 64)
          for dt in (torch.float32, torch.float64, torch.int32, torch.int64, torch.bfloat16):
              assert torch.ones(8, dtype=dt).dtype == dt
          x = torch.randn(10, requires_grad=True)
          ((x ** 2).sum()).backward()
          assert x.grad is not None and x.grad.shape == x.shape
          m = torch.nn.Linear(16, 4)
          f = tempfile.NamedTemporaryFile(suffix=".pt", delete=False)
          torch.save(m.state_dict(), f.name)
          torch.nn.Linear(16, 4).load_state_dict(torch.load(f.name, weights_only=True))
          os.unlink(f.name)
          g = torch.randn(8, 8, device="cuda")
          print((g @ g.T).sum().item())
          print("ROCm quick sanity gate passed")
          PY
            python -m pytest /pytorch/test/test_torch.py -q --timeout=120 -k "test_dir or test_type or test_dtypes"
          '

      - name: Run single-GPU test suite
        id: sgpu_run
        continue-on-error: true
        if: steps.gpu_check.outputs.gpu_available == 'true'
        env:
          TEST_LIST_B64: ${{ needs.determine-tests.outputs.sgpu_tests }}
        run: |
          COMMANDS=$(echo "$TEST_LIST_B64" | base64 -d)
          if [ -z "$COMMANDS" ]; then
            echo "No sgpu tests to run"
            echo "passed=0" >> "$GITHUB_OUTPUT"
            echo "failed=0" >> "$GITHUB_OUTPUT"
            echo "errors=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CMD_COUNT=$(echo "$COMMANDS" | grep -cve '^[[:space:]]*$' || true)
          echo "Running ${CMD_COUNT} single-GPU test command(s)"
          LOG=/tmp/rocm_sgpu_test_output.log
          echo "$COMMANDS" > /tmp/rocm_sgpu_test_commands.txt
          chmod a+r /tmp/rocm_sgpu_test_commands.txt

          # shellcheck disable=SC2086
          podman run --rm \
            ${PODMAN_ROCM_ARGS} \
            -e CONTINUE_THROUGH_ERROR=True \
            -e HIP_VISIBLE_DEVICES=0 \
            -v /tmp/rocm_sgpu_test_commands.txt:/tmp/test_commands.txt:Z,ro \
            "${IMAGE_TAG}" bash -c '
            source /miniconda/etc/profile.d/conda.sh && conda activate rocm_torch_build
            cd /pytorch
            PASSED=0; FAILED=0; ERRORS=""
            while IFS= read -r cmd; do
              [ -z "$cmd" ] && continue
              echo ""
              echo "============================================================"
              echo "Running: $cmd"
              echo "============================================================"
              echo "$cmd" > /tmp/_run.sh
              if timeout 7200 bash /tmp/_run.sh; then
                PASSED=$((PASSED + 1))
              else
                RC=$?
                FAILED=$((FAILED + 1))
                if [ $RC -eq 124 ]; then
                  ERRORS="${ERRORS}\n  TIMEOUT(2h): $cmd"
                else
                  ERRORS="${ERRORS}\n  FAIL: $cmd"
                fi
              fi
            done < /tmp/test_commands.txt
            echo ""
            echo ":::SUMMARY:::"
            echo "PASSED=${PASSED}"
            echo "FAILED=${FAILED}"
            if [ $FAILED -gt 0 ]; then
              echo -e "ERRORS=${ERRORS}"
            fi
          ' 2>&1 | tee "$LOG" || true

          PASSED=$(grep '^PASSED=' "$LOG" | tail -1 | cut -d= -f2)
          FAILED=$(grep '^FAILED=' "$LOG" | tail -1 | cut -d= -f2)
          FAIL_LIST=$(grep '^\s*\(FAIL\|TIMEOUT\)' "$LOG" || true)

          if [ "${CMD_COUNT}" -gt 0 ] && [ "${PASSED:-0}" = "0" ] && [ "${FAILED:-0}" = "0" ]; then
            echo "::error::Resolved ${CMD_COUNT} sgpu command(s) but executed none."
            FAILED="${CMD_COUNT}"
            FAIL_LIST="$(printf '  INFRA: zero commands executed\n%s' "${FAIL_LIST}")"
          fi

          echo "passed=${PASSED:-0}" >> "$GITHUB_OUTPUT"
          echo "failed=${FAILED:-0}" >> "$GITHUB_OUTPUT"
          {
            echo 'errors<<ERRORS_EOF'
            echo "$FAIL_LIST"
            echo 'ERRORS_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Test summary
        if: always()
        env:
          ERRORS_OUTPUT: ${{ steps.sgpu_run.outputs.errors }}
        run: |
          echo "## CRCR Nightly: RHEL 9.6 ROCm — Single-GPU Tests" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Nightly SHA | [\`${PYTORCH_SHA}\`](https://github.com/pytorch/pytorch/commit/${PYTORCH_SHA}) |" >> $GITHUB_STEP_SUMMARY
          echo "| GPUs | ${{ steps.gpu_check.outputs.gpu_count }} |" >> $GITHUB_STEP_SUMMARY
          FAILED="${{ steps.sgpu_run.outputs.failed || '0' }}"
          echo "| Passed | ${{ steps.sgpu_run.outputs.passed || '—' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Failed | ${FAILED} |" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.gpu_check.outputs.gpu_available }}" != "true" ]; then
            echo "| Result | \`skipped (no GPU)\` |" >> $GITHUB_STEP_SUMMARY
          elif [ "${FAILED}" -gt 0 ] 2>/dev/null; then
            echo "| Result | \`completed with failures\` |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Result | \`success\` |" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -n "$ERRORS_OUTPUT" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Failed Commands" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "$ERRORS_OUTPUT" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Determine conclusion
        id: conclusion
        if: always()
        env:
          FAILED: ${{ steps.sgpu_run.outputs.failed }}
        run: |
          if [ -n "$FAILED" ] && [ "$FAILED" != "0" ]; then
            echo "value=failure" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ job.status }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Report to CRCR
        if: always() && env.PUSH_TO_HUD == 'true' && steps.gpu_check.outputs.gpu_available == 'true'
        continue-on-error: true
        uses: pytorch/test-infra/.github/actions/cross-repo-ci-relay-callback@main
        with:
          status: completed
          conclusion: ${{ steps.conclusion.outputs.value }}
          delivery-id: ${{ needs.rocm-build.outputs.sha }}
          event-type: nightly
          job-name: "linux-rhel9.6-rocm7.14.0-py3.12-gcc11-x86_64 / test (sgpu, linux.rhel96-rocm)"

  mgpu-tests:
    name: "linux-rhel9.6-rocm7.14.0-py3.12-gcc11-x86_64 / test (mgpu, linux.rhel96-rocm)"
    needs: [rocm-build, determine-tests, sgpu-tests]
    # Allow sgpu skipped when test_categories=mgpu (or sgpu soft-failed).
    if: ${{ !cancelled() && needs.rocm-build.result == 'success' && needs.determine-tests.result == 'success' && (needs.sgpu-tests.result == 'success' || needs.sgpu-tests.result == 'skipped') && (inputs.test_categories == 'all' || inputs.test_categories == 'mgpu') }}
    runs-on: linux.rhel96-rocm
    timeout-minutes: 1440
    env:
      IMAGE_TAG: ${{ needs.rocm-build.outputs.image_tag }}
      PYTORCH_SHA: ${{ needs.rocm-build.outputs.sha }}
    steps:
      - name: Check multi-GPU availability
        id: gpu_check
        run: |
          GPU_COUNT=0
          if command -v rocm-smi &>/dev/null && rocm-smi &>/dev/null; then
            GPU_COUNT=$(rocm-smi -i 2>/dev/null | grep -c 'GPU\[' || true)
            if [ "${GPU_COUNT}" -eq 0 ]; then
              GPU_COUNT=$(rocm-smi --showid 2>/dev/null | grep -c 'GPU\[' || echo 0)
            fi
            rocm-smi || true
          elif [ -e /dev/kfd ] && [ -e /dev/dri ]; then
            # Fall back: count DRM render nodes (best-effort without rocm-smi).
            GPU_COUNT=$(ls /dev/dri/renderD* 2>/dev/null | wc -l)
          fi

          echo "gpu_count=${GPU_COUNT}" >> "$GITHUB_OUTPUT"
          if [ "${GPU_COUNT}" -ge 2 ]; then
            echo "mgpu_available=true" >> "$GITHUB_OUTPUT"
            echo "Found ${GPU_COUNT} AMD GPUs — multi-GPU tests enabled"
          else
            echo "mgpu_available=false" >> "$GITHUB_OUTPUT"
            echo "Only ${GPU_COUNT} GPU(s) — skipping multi-GPU tests (need 2+)"
          fi

      - name: Verify image exists
        if: steps.gpu_check.outputs.mgpu_available == 'true'
        run: |
          if ! podman image exists "${IMAGE_TAG}"; then
            echo "::error::Image ${IMAGE_TAG} not found in local podman store"
            exit 1
          fi

      - name: Run multi-GPU test suite
        id: mgpu_run
        continue-on-error: true
        if: steps.gpu_check.outputs.mgpu_available == 'true'
        env:
          TEST_LIST_B64: ${{ needs.determine-tests.outputs.mgpu_tests }}
        run: |
          COMMANDS=$(echo "$TEST_LIST_B64" | base64 -d)
          if [ -z "$COMMANDS" ]; then
            echo "No mgpu tests to run"
            echo "passed=0" >> "$GITHUB_OUTPUT"
            echo "failed=0" >> "$GITHUB_OUTPUT"
            echo "errors=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CMD_COUNT=$(echo "$COMMANDS" | grep -cve '^[[:space:]]*$' || true)
          echo "Running ${CMD_COUNT} multi-GPU test command(s)"
          LOG=/tmp/rocm_mgpu_test_output.log
          echo "$COMMANDS" > /tmp/rocm_mgpu_test_commands.txt
          chmod a+r /tmp/rocm_mgpu_test_commands.txt

          # All GPUs visible (do not set HIP_VISIBLE_DEVICES). NCCL tests use RCCL on ROCm.
          # shellcheck disable=SC2086
          podman run --rm \
            ${PODMAN_ROCM_ARGS} \
            -e CONTINUE_THROUGH_ERROR=True \
            -v /tmp/rocm_mgpu_test_commands.txt:/tmp/test_commands.txt:Z,ro \
            "${IMAGE_TAG}" bash -c '
            source /miniconda/etc/profile.d/conda.sh && conda activate rocm_torch_build
            cd /pytorch
            PASSED=0; FAILED=0; ERRORS=""
            while IFS= read -r cmd; do
              [ -z "$cmd" ] && continue
              echo ""
              echo "============================================================"
              echo "Running: $cmd"
              echo "============================================================"
              echo "$cmd" > /tmp/_run.sh
              if timeout 43200 bash /tmp/_run.sh; then
                PASSED=$((PASSED + 1))
              else
                RC=$?
                FAILED=$((FAILED + 1))
                if [ $RC -eq 124 ]; then
                  ERRORS="${ERRORS}\n  TIMEOUT(12h): $cmd"
                else
                  ERRORS="${ERRORS}\n  FAIL: $cmd"
                fi
              fi
            done < /tmp/test_commands.txt
            echo ""
            echo ":::SUMMARY:::"
            echo "PASSED=${PASSED}"
            echo "FAILED=${FAILED}"
            if [ $FAILED -gt 0 ]; then
              echo -e "ERRORS=${ERRORS}"
            fi
          ' 2>&1 | tee "$LOG" || true

          PASSED=$(grep '^PASSED=' "$LOG" | tail -1 | cut -d= -f2)
          FAILED=$(grep '^FAILED=' "$LOG" | tail -1 | cut -d= -f2)
          FAIL_LIST=$(grep '^\s*\(FAIL\|TIMEOUT\)' "$LOG" || true)

          if [ "${CMD_COUNT}" -gt 0 ] && [ "${PASSED:-0}" = "0" ] && [ "${FAILED:-0}" = "0" ]; then
            echo "::error::Resolved ${CMD_COUNT} mgpu command(s) but executed none."
            FAILED="${CMD_COUNT}"
            FAIL_LIST="$(printf '  INFRA: zero commands executed\n%s' "${FAIL_LIST}")"
          fi

          echo "passed=${PASSED:-0}" >> "$GITHUB_OUTPUT"
          echo "failed=${FAILED:-0}" >> "$GITHUB_OUTPUT"
          {
            echo 'errors<<ERRORS_EOF'
            echo "$FAIL_LIST"
            echo 'ERRORS_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Test summary
        if: always()
        env:
          ERRORS_OUTPUT: ${{ steps.mgpu_run.outputs.errors }}
        run: |
          echo "## CRCR Nightly: RHEL 9.6 ROCm — Multi-GPU Tests" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Nightly SHA | [\`${PYTORCH_SHA}\`](https://github.com/pytorch/pytorch/commit/${PYTORCH_SHA}) |" >> $GITHUB_STEP_SUMMARY
          echo "| GPUs | ${{ steps.gpu_check.outputs.gpu_count }} |" >> $GITHUB_STEP_SUMMARY
          FAILED="${{ steps.mgpu_run.outputs.failed || '0' }}"
          echo "| Passed | ${{ steps.mgpu_run.outputs.passed || '—' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Failed | ${FAILED} |" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.gpu_check.outputs.mgpu_available }}" != "true" ]; then
            echo "| Result | \`skipped (need 2+ GPUs)\` |" >> $GITHUB_STEP_SUMMARY
          elif [ "${FAILED}" -gt 0 ] 2>/dev/null; then
            echo "| Result | \`completed with failures\` |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Result | \`success\` |" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -n "$ERRORS_OUTPUT" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Failed Commands" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "$ERRORS_OUTPUT" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Determine conclusion
        id: conclusion
        if: always()
        env:
          FAILED: ${{ steps.mgpu_run.outputs.failed }}
        run: |
          if [ -n "$FAILED" ] && [ "$FAILED" != "0" ]; then
            echo "value=failure" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ job.status }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Report to CRCR
        if: always() && env.PUSH_TO_HUD == 'true' && steps.gpu_check.outputs.mgpu_available == 'true'
        continue-on-error: true
        uses: pytorch/test-infra/.github/actions/cross-repo-ci-relay-callback@main
        with:
          status: completed
          conclusion: ${{ steps.conclusion.outputs.value }}
          delivery-id: ${{ needs.rocm-build.outputs.sha }}
          event-type: nightly
          job-name: "linux-rhel9.6-rocm7.14.0-py3.12-gcc11-x86_64 / test (mgpu, linux.rhel96-rocm)"
